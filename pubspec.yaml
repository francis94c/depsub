name: depsub
description: A tool for managing Dart project dependencies, especially local dependencies or overrides you can't publish.
version: 1.0.0
repository: https://github.com/francis94c/depsub

environment:
  sdk: ^3.13.3

dependencies:
  path: ^1.9.0
  args: ^2.5.0
  yaml: ^3.1.4
  yaml_edit: ^2.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

executables:
  depsub: depsub

topics:
  - dart
  - pub
  - dependency-override
  - flutter
  - path
